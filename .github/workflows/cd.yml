name: CD

on:
  push:
    branches: [ master ]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PROJECT_NAME: "LogicBuilder.Samples.Contoso.Services"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/bpsLogicBuilder/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}

      - name: Run unit tests
        run: dotnet test Contoso.Bsl.Flow.Tests/Contoso.Bsl.Flow.Tests.csproj --verbosity normal --configuration Release /p:CollectCoverage=true /p:Threshold=50 /p:ThresholdType=line /p:ThresholdStat=Average /p:CoverletOutput=./TestResults/ /p:ExcludeByAttribute="GeneratedCodeAttribute" /p:CoverletOutputFormat=opencover /p:Exclude="[Contoso.Api]*"

  deploy-container-app:
    name: Deploy Workfow App
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BpsLogicBuilder'
    permissions:
      id-token: write
      contents: read
    needs: test
    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
      with:
        client-id: ${{ secrets.ARM_DEPLOYER_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        
    - name: Get Existing ACR Login Server
      id: get_existing_acr
      uses: azure/arm-deploy@65ae74fb7aec7c680c88ef456811f353adae4d06
      env:
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_CONTOSO }}
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ env.RESOURCE_GROUP}}
        template: ./infrastructure/existing-acr.bicep
        failOnStdErr: false

    - name: Build and Upload Contoso.Api Image
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        ACR_LOGIN_SERVER_NAME: ${{ steps.get_existing_acr.outputs.acrLoginServer }}
      run: |
        echo "ACR LOGIN SERVER NAME ${{ env.ACR_LOGIN_SERVER_NAME }}"
        az acr build --registry ${{ env.ACR_LOGIN_SERVER_NAME }} --image contosoapi:${{ env.IMAGE_TAG }} --image contosoapi:latest --file ./Contoso.Api/Dockerfile .

    - name: Build and Upload Contoso.Bsl Image
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        ACR_LOGIN_SERVER_NAME: ${{ steps.get_existing_acr.outputs.acrLoginServer }}
      run: |
        echo "ACR LOGIN SERVER NAME ${{ env.ACR_LOGIN_SERVER_NAME }}"
        az acr build --registry ${{ env.ACR_LOGIN_SERVER_NAME }} --image contosobsl:${{ env.IMAGE_TAG }} --image contosobsl:latest --file ./Contoso.Bsl/Dockerfile .

    - name: Update Contoso.Api Container App image source
      uses: azure/arm-deploy@65ae74fb7aec7c680c88ef456811f353adae4d06
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_CONTOSO }}
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ env.RESOURCE_GROUP}}
        parameters: imageTag=${{ env.IMAGE_TAG }}
        template: ./infrastructure/contosoapi.bicep
        failOnStdErr: false

    - name: Update Contoso.Bsl Container App image source
      uses: azure/arm-deploy@65ae74fb7aec7c680c88ef456811f353adae4d06
      env:
        IMAGE_TAG: "v1.0.${{ github.run_number }}"
        RESOURCE_GROUP: ${{ secrets.AZURE_RG_CONTOSO }}
      with:
        subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION }}
        resourceGroupName: ${{ env.RESOURCE_GROUP}}
        parameters: imageTag=${{ env.IMAGE_TAG }}
        template: ./infrastructure/contosobsl.bicep
        failOnStdErr: false