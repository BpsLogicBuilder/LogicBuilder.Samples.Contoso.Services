apiVersion: apps/v1
kind: Deployment
metadata:
  name: contoso-bsl
  namespace: contoso-apps
  labels:
    app: contoso-bsl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: contoso-bsl
  template:
    metadata:
      labels:
        app: contoso-bsl
    spec:
      automountServiceAccountToken: false
      containers:
      - name: contoso-bsl
        image: ACR_NAME.azurecr.io/contosobsl:IMAGE_TAG
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-connection-string
        - name: ExpectedCerificateThumbprint
          value: "EXPECTED_CERTIFICATE_THUMBPRINT"
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "512Mi"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /weatherforecast
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5